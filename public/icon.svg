<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Ambient Inner Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#codeGrad)" stroke-width="12" opacity="0.4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#codeGrad)" stroke-width="4" opacity="0.8" />
  
  <!-- Code bracket < / > symbol inside -->
  <g transform="translate(256, 256) scale(0.9) translate(-256, -256)" filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 180 180 L 100 256 L 180 332" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash / -->
    <path d="M 280 150 L 232 362" fill="none" stroke="#a855f7" stroke-width="26" stroke-linecap="round" />
    <!-- Right Bracket > -->
    <path d="M 332 180 L 412 256 L 332 332" fill="none" stroke="#818cf8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Center tech dots for HTML, CSS, JS -->
  <circle cx="216" cy="410" r="10" fill="#f97316" /> <!-- HTML5 Orange -->
  <circle cx="256" cy="410" r="10" fill="#0ea5e9" /> <!-- CSS3 Blue -->
  <circle cx="296" cy="410" r="10" fill="#eab308" /> <!-- JS Yellow -->
</svg>
